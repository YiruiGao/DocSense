[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast isolated tests
    component: in-process service/module tests
    integration: tests requiring local services or containers
    slow: slow tests
    external: tests requiring network or third-party APIs
addopts =
    --strict-markers
    --strict-config
